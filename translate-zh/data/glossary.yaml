  context: 上下文          # freq 2242，context window -> 上下文窗口
  context engineering: 上下文工程
  harness: 编排层          # freq 613，指 agent 的外层调度框架
  agentic: 智能体式
  subagent: 子智能体       # freq 213
  reasoning: 推理          # freq 708
  inference: 推理          # freq 205，与 reasoning 区分时用「推断」
  embedding model: 嵌入模型
  retrieval: 检索          # freq 553
  chunk: 分块              # freq 97
  vector: 向量             # freq 699
  trace: 追踪              # freq 539
  traces: 追踪记录         # freq 801
  evaluation: 评估         # freq 1006
  evals: 评估              # freq 436，作名词时译「评估集」
  benchmark: 基准测试      # freq 253
  latency: 延迟            # freq 332
  throughput: 吞吐量       # freq 28
  guardrail: 护栏          # freq 6
