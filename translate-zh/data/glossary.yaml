# ---------------------------------------------------------------------------
# gloss：首现加「通俗括注」的译名
# 形态：译名（English 原词，即 gloss）
# 与 expand 的区别：expand 补的是「中英全称」（读者缺的是展开），gloss 补的是
#   「人话解释」（读者缺的是概念本身）。全文只括注一次，后文一律只用译名。
# 不是每个词都加 —— 读者一眼就懂的不加，加多了是噪音。是否加由本表逐条决定。
#
# 维护权限（三层）：
#   执行 agent —— 只读 + 临机回报（遇到表里没有的词，自己定译法并在回执/
#     「翻译说明」里报告），绝不直接改本文件（防各块自定标准造成漂移）
#   主 agent —— **先行给出，默认生效**：汇总临机决定落盘（先 lexicon.md 临时，
#     稳定后提升进这里永久），并在篇末「翻译说明」列出本篇新增/变更的词条。
#     只有先给出用户才能反馈；用户没提 = 认可，不要等用户确认才落盘
#   用户 —— 优先级最高，是否决制：对已生效条目一句话即覆盖/否决，立即生效
# ---------------------------------------------------------------------------
gloss:
  human-in-the-loop:
    zh: 人在回路
    gloss: 即每个关键步骤由人工审批/介入
  human-on-the-loop:
    zh: 人在环上
    gloss: 即人工监督运行、必要时接管

# ---------------------------------------------------------------------------
# translate：明确要翻成中文的词（避免译文里夹生英文）
# ---------------------------------------------------------------------------
