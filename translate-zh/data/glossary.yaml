# 术语表 —— translate-zh 的唯一真相源
#
# 生成方式：scan_corpus.py 扫描 744 篇真实语料 → 人工确认后填入本文件。
# SKILL.md 里不重复列举术语，执行时读本文件。
# 频次 = 该词在语料中的真实出现次数，用来决定「值不值得为它定规则」。

meta:
  corpus: G:/05_代码项目/blog-research-crawlers
  scanned_files: 744
  generated: 2026-10-02
  candidates: data/candidates.md   # 未确认的完整候选清单

# ---------------------------------------------------------------------------
# keep：原样保留，不翻译
# 判据：中文技术读者一眼就懂，且翻译后会产生歧义或变得难检索
# ---------------------------------------------------------------------------
keep:
  # 公司与产品（专有名词，翻了反而认不出）
  - Anthropic
  - OpenAI
  - NVIDIA
  - LangChain
  - LangGraph
  - LangSmith
  # 模型名
  - Claude
  - GPT
  - GLM
  - Mythos
  - Opus
  - Sonnet
  - Haiku
  # 架构名：翻成中文会产生歧义
  # Transformer -> 变换器 会被误读成电力变压器，这是设定 keep 的最典型理由
  - Transformer
  - BERT
  - LSTM
  - CNN
  - GAN
  - VAE
  - CLIP
  # 协议 / 接口 / 工具
  - API
  - SDK
  - CLI
  - SQL
  - MCP
  # 硬件与平台
  - GPU
  - AWS
  # 会议与基准
  - ICML
  - ICLR
  - SWE-bench
  # 技术词：中文语境已普遍直接使用
  - token
  - embedding
  - prompt

