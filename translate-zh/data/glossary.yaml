  tools: 工具              # freq 1764

# ---------------------------------------------------------------------------
# pending：高频但尚未拍板，暂按 fallback 处理
# 这几条决定译文整体风格，拍板后从这里移到 keep / translate
# ---------------------------------------------------------------------------
pending:
  - word: AI
    freq: 5188
    fallback: 保留 AI
    note: >
      「人工智能」是标准译法，但全文高频出现时「人工智能」明显啰嗦。
      可选：全文保留 AI；或首次写「人工智能（AI）」后文用 AI。

  - word: LLM
    freq: 2364
    fallback: 保留 LLM
    note: >
      中文有「大语言模型」「大模型」两种说法。
      可选：保留 LLM；首次写「大语言模型（LLM）」后文用「大模型」。

  - word: skill / skills
    freq: 756           # 264 + 492
    fallback: 技能
    note: >
      LangChain/Anthropic 语境里的 skill 是特定机制名（含 SKILL.md 的目录包）。
      若指该机制，倾向保留 skill；若泛指能力，译「技能」。

  - word: memory
    freq: 1325
    fallback: 记忆
    note: >
      泛指时译「记忆」；若指 agent 的 memory 机制（如 LangMem），倾向保留 memory。

# ---------------------------------------------------------------------------
# units：数字与单位，不换算
# 语料实测：参数量只有符号写法（70B/7B/13B/32B），billion parameters 一次都没出现
# ---------------------------------------------------------------------------
units:
  parameters:
    rule: 保留符号，不换算成中文数量级
    examples: [7B, 13B, 70B, 32B, 1.5B, 300B]
    wrong_examples: ["70 亿", "十亿", "700 亿"]
    note: 7B 就是 7B，不写「70 亿参数」
  tokens:
    rule: 保留符号，不换算
    examples: [128K, 1M, 3.5T, 34.1T]
    wrong_examples: ["12.8 万", "35 万亿"]
  decimal:
    rule: 数值本身不改；货币与日期按中文习惯，数值不变
